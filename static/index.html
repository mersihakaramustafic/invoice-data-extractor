<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invoice Extractor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 16px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 36px;
      width: 100%;
      max-width: 680px;
    }
    h1 { font-size: 22px; font-weight: 600; margin-bottom: 8px; color: #111; }
    .subtitle {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .subtitle .dot {
      width: 8px; height: 8px;
      background: #22c55e;
      border-radius: 50%;
      display: inline-block;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .upload-area {
      border: 2px dashed #d1d5db;
      border-radius: 8px;
      padding: 32px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      margin-bottom: 16px;
    }
    .upload-area:hover, .upload-area.drag-over { border-color: #6366f1; background: #f5f3ff; }
    .upload-area input { display: none; }
    .upload-icon { font-size: 36px; margin-bottom: 8px; }
    .upload-area p { color: #6b7280; font-size: 14px; }
    .upload-area .hint { font-size: 12px; color: #9ca3af; margin-top: 4px; }

    /* selection summary */
    .selection {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .selection .sel-info { font-size: 14px; color: #111; }
    .selection .sel-info span { font-weight: 600; color: #6366f1; }
    .selection .clear-btn {
      font-size: 12px;
      color: #6b7280;
      cursor: pointer;
      background: none;
      border: none;
      width: auto;
      padding: 4px 8px;
      font-weight: 500;
    }
    .selection .clear-btn:hover { color: #dc2626; background: none; }

    /* progress */
    .progress-wrap { display: none; margin-bottom: 16px; }
    .progress-label { font-size: 13px; color: #374151; margin-bottom: 6px; display: flex; justify-content: space-between; }
    .progress-bar-track { background: #e5e7eb; border-radius: 999px; height: 8px; overflow: hidden; }
    .progress-bar-fill { background: #6366f1; height: 100%; border-radius: 999px; transition: width 0.3s ease; width: 0%; }

    button#uploadBtn {
      width: 100%;
      padding: 12px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    button#uploadBtn:hover:not(:disabled) { background: #4f46e5; }
    button#uploadBtn:disabled { background: #a5b4fc; cursor: not-allowed; }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: #9ca3af;
      font-size: 12px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e5e7eb;
    }

    button#processBtn {
      width: 100%;
      padding: 12px;
      background: #fff;
      color: #6366f1;
      border: 1.5px solid #6366f1;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    button#processBtn:hover:not(:disabled) { background: #f5f3ff; }
    button#processBtn:disabled { border-color: #a5b4fc; color: #a5b4fc; cursor: not-allowed; }

    .process-result { display: none; margin-top: 20px; }
    .process-result h3 { font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 12px; }

    /* result summary */
    .result-summary { display: none; margin-top: 20px; }
    .stat-row {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    .stat {
      flex: 1;
      padding: 14px;
      border-radius: 8px;
      text-align: center;
    }
    .stat.ok   { background: #f0fdf4; border: 1px solid #bbf7d0; }
    .stat.skip { background: #fefce8; border: 1px solid #fde68a; }
    .stat.fail { background: #fef2f2; border: 1px solid #fecaca; }
    .stat .num  { font-size: 24px; font-weight: 700; color: #111; }
    .stat .lbl  { font-size: 12px; color: #6b7280; margin-top: 2px; }
    .stat.ok .num  { color: #16a34a; }
    .stat.skip .num { color: #ca8a04; }
    .stat.fail .num { color: #dc2626; }

    .failures { display: none; }
    .failures h3 { font-size: 13px; font-weight: 600; color: #dc2626; margin-bottom: 8px; }
    .failure-item {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 8px 12px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 13px;
    }
    .failure-item .fname { font-weight: 500; color: #111; }
    .failure-item .reason { color: #dc2626; font-size: 12px; }

    .info-bar {
      margin-top: 20px;
      padding: 10px 14px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      font-size: 13px;
      color: #1d4ed8;
    }
    .error-banner {
      margin-top: 12px;
      padding: 10px 14px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      color: #dc2626;
      font-size: 13px;
      display: none;
    }
    .btn-spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid #fff; border-top-color: transparent;
      border-radius: 50%; animation: spin 0.7s linear infinite;
      vertical-align: middle; margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="card">
  <h1>Invoice Extractor</h1>
  <p class="subtitle">
    <span class="dot"></span>
    Upload and extract invoice data
  </p>

  <div class="upload-area" id="dropZone">
    <input type="file" id="fileInput" accept=".pdf" multiple />
    <div class="upload-icon">📄</div>
    <p>Drag &amp; drop PDFs here, or <strong>click to browse</strong></p>
    <p class="hint">Multiple files supported</p>
  </div>

  <div class="selection" id="selection">
    <div class="sel-info">
      <span id="selCount">0</span> PDF file(s) selected
    </div>
    <button class="clear-btn" id="clearBtn">Clear</button>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-label">
      <span id="progressLabel">Uploading…</span>
      <span id="progressPct">0%</span>
    </div>
    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
  </div>

  <button id="uploadBtn" disabled>Upload to Bucket</button>
  <div class="error-banner" id="errorBanner"></div>

  <div class="result-summary" id="resultSummary">
    <div class="stat-row">
      <div class="stat ok">
        <div class="num" id="statUploaded">0</div>
        <div class="lbl">Uploaded</div>
      </div>
      <div class="stat skip">
        <div class="num" id="statDuplicate">0</div>
        <div class="lbl">Duplicate</div>
      </div>
      <div class="stat skip">
        <div class="num" id="statRejected">0</div>
        <div class="lbl">Rejected</div>
      </div>
      <div class="stat fail">
        <div class="num" id="statFailed">0</div>
        <div class="lbl">Failed</div>
      </div>
    </div>
    <div class="failures" id="failureList">
      <h3>Failed files</h3>
      <div id="failureItems"></div>
    </div>
  </div>

  <div class="divider">or</div>
  <button id="processBtn">Process Now</button>
  <div class="error-banner" id="processBanner"></div>

  <div id="procStatus" style="display:none; margin-top:20px;">
    <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
      <span id="procStatusLabel" style="font-size:13px; color:#374151;">Processing…</span>
      <span id="procStatusPct" style="font-size:13px; color:#374151;">0%</span>
    </div>
    <div style="background:#e5e7eb; border-radius:999px; height:8px; overflow:hidden;">
      <div id="procStatusBar" style="background:#6366f1; height:100%; border-radius:999px; transition:width 0.3s ease; width:0%;"></div>
    </div>
    <div class="stat-row" style="margin-top:12px;">
      <div class="stat ok" ><div class="num" id="procDone">0</div><div class="lbl">Succeeded</div></div>
      <div class="stat fail"><div class="num" id="procFail">0</div><div class="lbl">Failed</div></div>
      <div class="stat skip"><div class="num" id="procLeft">0</div><div class="lbl">Remaining</div></div>
    </div>
  </div>

</div>

<script>
  const dropZone    = document.getElementById('dropZone');
  const fileInput   = document.getElementById('fileInput');
  const selection   = document.getElementById('selection');
  const selCount    = document.getElementById('selCount');
  const clearBtn    = document.getElementById('clearBtn');
  const progressWrap = document.getElementById('progressWrap');
  const progressLabel = document.getElementById('progressLabel');
  const progressPct  = document.getElementById('progressPct');
  const progressFill = document.getElementById('progressFill');
  const uploadBtn   = document.getElementById('uploadBtn');
  const errorBanner = document.getElementById('errorBanner');
  const resultSummary = document.getElementById('resultSummary');
  const failureList   = document.getElementById('failureList');
  const failureItems  = document.getElementById('failureItems');

  const BATCH_SIZE = 20;
  let selectedFiles = [];

  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    addFiles(Array.from(e.dataTransfer.files));
  });
  fileInput.addEventListener('change', () => { addFiles(Array.from(fileInput.files)); fileInput.value = ''; });
  clearBtn.addEventListener('click', clearSelection);

  function addFiles(files) {
    const pdfs = files.filter(f => f.name.endsWith('.pdf'));
    const bad  = files.length - pdfs.length;
    if (bad) showError(`${bad} non-PDF file(s) were ignored.`);
    const existing = new Set(selectedFiles.map(f => f.name));
    pdfs.forEach(f => { if (!existing.has(f.name)) selectedFiles.push(f); });
    updateSelectionUI();
  }

  function clearSelection() {
    selectedFiles = [];
    updateSelectionUI();
    resultSummary.style.display = 'none';
    errorBanner.style.display = 'none';
  }

  function updateSelectionUI() {
    const hasFiles = selectedFiles.length > 0;
    selection.style.display = hasFiles ? 'flex' : 'none';
    selCount.textContent = selectedFiles.length;
    uploadBtn.disabled = !hasFiles;
  }

  function setProgress(done, total) {
    const pct = Math.round((done / total) * 100);
    progressFill.style.width = pct + '%';
    progressPct.textContent  = pct + '%';
    progressLabel.textContent = `Uploading ${done} / ${total} files…`;
  }

  uploadBtn.addEventListener('click', async () => {
    if (!selectedFiles.length) return;

    errorBanner.style.display = 'none';
    resultSummary.style.display = 'none';
    uploadBtn.disabled = true;
    uploadBtn.innerHTML = '<span class="btn-spinner"></span>Uploading…';
    progressWrap.style.display = 'block';
    setProgress(0, selectedFiles.length);

    let uploaded = 0, rejected = 0, failed = 0, duplicates = 0;
    const failures = [];
    let done = 0;

    // send in batches to show progress and avoid request size limits
    for (let i = 0; i < selectedFiles.length; i += BATCH_SIZE) {
      const batch = selectedFiles.slice(i, i + BATCH_SIZE);
      const form = new FormData();
      batch.forEach(f => form.append('files', f));

      try {
        const res  = await fetch('/invoices/upload', { method: 'POST', body: form });
        const data = await res.json();
        if (!res.ok) { showError(data.detail || 'Upload failed.'); break; }
        data.forEach(r => {
          if (r.status === 'uploaded')        uploaded++;
          else if (r.status === 'duplicate') duplicates++;
          else if (r.status === 'rejected')  rejected++;
          else { failed++; failures.push(r); }
        });
      } catch (e) {
        failed += batch.length;
        batch.forEach(f => failures.push({ file: f.name, status: 'error', detail: e.message }));
      }

      done += batch.length;
      setProgress(done, selectedFiles.length);
    }

    progressWrap.style.display = 'none';
    uploadBtn.disabled = false;
    uploadBtn.innerHTML = 'Upload to Bucket';

    document.getElementById('statUploaded').textContent  = uploaded;
    document.getElementById('statDuplicate').textContent = duplicates;
    document.getElementById('statRejected').textContent  = rejected;
    document.getElementById('statFailed').textContent    = failed;
    resultSummary.style.display = 'block';

    if (failures.length) {
      failureItems.innerHTML = failures.map(r =>
        `<div class="failure-item">
          <span class="fname">${r.file}</span>
          <span class="reason">${r.detail || r.status}</span>
        </div>`
      ).join('');
      failureList.style.display = 'block';
    } else {
      failureList.style.display = 'none';
    }

    selectedFiles = [];
    updateSelectionUI();
  });

  function showError(msg) {
    errorBanner.textContent = msg;
    errorBanner.style.display = 'block';
  }

  const processBtn    = document.getElementById('processBtn');
  const processBanner = document.getElementById('processBanner');
  const procStatus    = document.getElementById('procStatus');
  const procStatusLabel = document.getElementById('procStatusLabel');
  const procStatusPct   = document.getElementById('procStatusPct');
  const procStatusBar   = document.getElementById('procStatusBar');

  let pollTimer = null;
  let batchTotal = 0;
  let batchBaseDone = 0;

  function updateProcStatus(counts, running) {
    const done      = counts.processed;
    const failed    = counts.failed;
    const remaining = counts.pending + counts.processing;
    const total     = done + failed + remaining;
    const pct       = total > 0 ? Math.round(((done + failed) / total) * 100) : 0;

    procStatusBar.style.width = pct + '%';
    procStatusPct.textContent  = pct + '%';
    procStatusLabel.textContent = running ? `Processing… (${remaining} remaining)` : 'Done';
    document.getElementById('procDone').textContent = done;
    document.getElementById('procFail').textContent = failed;
    document.getElementById('procLeft').textContent = remaining;
    procStatus.style.display = 'block';
  }

  async function pollOnce() {
    try {
      const res  = await fetch('/invoices/batch/status');
      const data = await res.json();
      updateProcStatus(data.counts, data.running);
      if (!data.running) {
        clearInterval(pollTimer);
        pollTimer = null;
        processBtn.disabled = false;
        processBtn.innerHTML = 'Process Now';
      }
    } catch (_) {}
  }

  function startPolling() {
    if (pollTimer) return;
    pollOnce();
    pollTimer = setInterval(pollOnce, 3000);
  }

  processBtn.addEventListener('click', async () => {
    processBanner.style.display = 'none';
    processBtn.disabled = true;
    processBtn.innerHTML = '<span class="btn-spinner" style="border-color:#6366f1;border-top-color:transparent"></span>Starting…';

    try {
      const res  = await fetch('/invoices/batch', { method: 'POST' });
      const data = await res.json();
      if (!res.ok) {
        processBanner.style.cssText = '';
        processBanner.textContent = data.detail || 'Processing failed.';
        processBanner.style.display = 'block';
        processBtn.disabled = false;
        processBtn.innerHTML = 'Process Now';
        return;
      }

      if (data.status === 'nothing_to_process') {
        processBanner.style.background = '#eff6ff';
        processBanner.style.borderColor = '#bfdbfe';
        processBanner.style.color = '#1d4ed8';
        processBanner.textContent = 'No pending invoices to process.';
        processBanner.style.display = 'block';
        processBtn.disabled = false;
        processBtn.innerHTML = 'Process Now';
      } else {
        processBanner.style.display = 'none';
        startPolling();
      }
    } catch (e) {
      processBanner.textContent = e.message;
      processBanner.style.display = 'block';
      processBtn.disabled = false;
      processBtn.innerHTML = 'Process Now';
    }
  });
</script>
</body>
</html>
